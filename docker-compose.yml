services:
  api:
    build: .
    environment:
      DATABASE_URL: sqlite:////data/store_intelligence.db
    volumes: [dbdata:/data]
    command: sh -c "python scripts/seed_demo.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10
  dashboard:
    build: .
    environment:
      API_URL: http://api:8000
    command: streamlit run dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  dbdata:
